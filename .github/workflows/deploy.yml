name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Caché de las variantes de imagen generadas por astro:assets (avif/webp).
      - name: Cache Astro image optimizations
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_SITE_URL: https://saltico.github.io
          BASE_PATH: /autocapital-demo
          BUILD_FORMAT: file
          # Demo de propuesta: no indexar
          PUBLIC_NOINDEX: "true"
          PUBLIC_SITE_NAME: AutoCapital
          # Datos públicos (ya visibles en el sitio actual); no son secretos.
          PUBLIC_CONTACT_PHONE: "+573008415421"
          PUBLIC_WHATSAPP_NUMBER: "573008415421"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
